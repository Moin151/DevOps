version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://dummy:1234@cluster0.qqeazm5.mongodb.net/tutedude_db?retryWrites=true&w=majority

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - FLASK_URL=http://backend:5000
    depends_on:
      - backend